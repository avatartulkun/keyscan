<script>
const ZH={
title:"KeyScan 帮助说明书",subtitle:"离线帮助 · 内容按功能顺序整理",quick:"简要版",full:"完整版",toc:"目录导航",
s1t:"1. 快速开始",s1:`<ol><li>首次打开后设置密码账本的解锁密码与安全问题。</li><li>需要时在安全中心开启生物识别。</li><li>从首页进入扫描、密码账本、TOTP、安全保险箱或分享中心。</li><li>重要数据录入后，立即在“备份与恢复”创建一次加密备份。</li></ol>`,
s2t:"2. 功能使用",s2:`<h3>智能扫描</h3><p>允许相机权限后扫描二维码或条形码；也可从相册识别。核对结果后再打开链接或保存。</p><h3>密码账本</h3><p>保存网站、账号、密码和备注。默认分组及用户自定义文件夹默认折叠，点文件夹行展开。可用随机密码生成器创建强密码。</p><h3>TOTP 认证器</h3><p>扫码或手动输入密钥添加动态验证码。转移前请先确认服务商提供的恢复方式。</p><h3>安全保险箱</h3><p>用于保存敏感记录与附件。导出可包含附件，导出包应保存在可信位置。</p><h3>安全分享</h3><p>列表中长按内容即可分享；不再提供右上角独立分享按钮。</p>`,
s3t:"3. 安全中心",s3:`<p>安全中心统一管理应用解锁密码、生物识别、数据保护密钥、备份与恢复及安全状态。</p><ul><li>解锁密码保护进入应用或敏感页面。</li><li>生物识别只是便捷验证方式，仍应牢记主密码。</li><li>数据保护密钥用于加密备份；遗失后可能无法恢复旧备份。</li><li>导出文件、恢复密钥和 WebDAV 应用密码不要通过公开聊天发送。</li></ul>`,
s4t:"4. 备份与恢复",s4:`<p>目的：在换机、重装或设备故障时恢复 KeyScan 数据。备份内容会在上传前加密。</p><ol><li>打开安全中心 → 备份与恢复。</li><li>设置并妥善保存数据保护密钥。</li><li>配置 WebDAV 地址、账号和应用专用密码，先测试连接。</li><li>执行立即备份并确认成功时间。</li><li>恢复时选择正确备份，输入对应密钥，完成后核对记录数量与附件。</li></ol><p class="note">同步不是误删保护的替代品。重大调整前建议另存一份离线加密导出。</p>`,
s5t:"5. 公共 WebDAV 服务",s5:`<p>以下只说明免费注册/使用地区与接入方法；免费政策和地区可用性可能变化，请以服务商页面为准。</p>
<h3>InfiniCLOUD — 日本及亚洲用户</h3><p>目前提供可注册的免费账户，免费方案支持 WebDAV。登录 My Page，开启 Apps Connection，复制页面为你的账号生成的 WebDAV Connection URL、User ID 和 Apps Password；每个账号 URL 不同，不要照抄他人的地址。</p>
<h3>Koofr — 全球多数地区</h3><p>可注册免费账户。网页端进入 Account Settings → Preferences → Password，生成应用专用密码。服务器：<code>https://app.koofr.net/dav/Koofr</code>，端口 443，账号为注册邮箱。路径大小写敏感。</p>
<h3>坚果云 — 中国大陆用户</h3><p>可注册免费账户。网页端进入账户信息 → 安全选项 → 第三方应用管理，添加 KeyScan 并生成应用密码。先在网盘建立 keyscan 文件夹；服务器可填 <code>https://dav.jianguoyun.com/dav/keyscan</code>，账号为邮箱，密码必须使用应用密码。</p>
<h3>Yandex Disk — 可注册 Yandex 账号的地区</h3><p>服务器为 <code>https://webdav.yandex.ru</code>，端口 443，需创建 WebDAV 应用密码。重要：自 2026-06-22 起，Yandex 官方要求使用 Yandex 360 付费方案才能通过 WebDAV 访问，因此不再属于免费 WebDAV 选项。</p>`,
s6t:"6. 家庭 NAS WebDAV",s6:`<p>手机与 NAS 连接同一个家庭路由器/Wi‑Fi 后即可使用，无需把 NAS 暴露到互联网。先为 KeyScan 建立独立用户和文件夹，只授予该文件夹读写权限。</p>
<h3>群晖 Synology</h3><ol><li>套件中心安装 WebDAV Server。</li><li>启用 HTTPS（通常 5006；HTTP 通常 5005）。</li><li>授予用户 WebDAV 应用权限及目标共享文件夹读写权限。</li><li>KeyScan 地址填 <code>https://NAS局域网IP:5006/目标文件夹</code>。自签名证书可能导致校验失败；QuickConnect 不支持 WebDAV。</li></ol>
<h3>威联通 QNAP</h3><ol><li>控制台 → 应用程序 → Web 服务器 → WebDAV，启用服务。</li><li>设置共享文件夹或 WebDAV 权限，并记录端口。</li><li>地址通常为 <code>http(s)://NAS局域网IP:端口/共享文件夹</code>。</li></ol>
<h3>铁威马 TerraMaster</h3><ol><li>在 TOS 控制面板的文件服务中打开 WebDAV。</li><li>设置服务端口，给独立用户分配目标文件夹读写权限。</li><li>使用 NAS 局域网 IP、端口、用户名和密码在 KeyScan 测试连接。</li></ol>
<p class="note">局域网 IP 变化会导致连接失败，可在路由器为 NAS 保留固定 DHCP 地址。除非了解 HTTPS、证书、防火墙和访问控制，否则不要做公网端口映射。</p>`,
s7t:"7. 故障排查",s7:`<ul><li>401/403：核对账号、应用专用密码和文件夹权限。</li><li>404：核对服务器路径、文件夹名及 Koofr 的大小写。</li><li>超时：确认手机联网；NAS 场景确认手机和 NAS 在同一家庭网络。</li><li>证书错误：优先使用有效 HTTPS 证书；不要为省事长期关闭证书校验。</li><li>恢复失败：确认选择的是 KeyScan 备份，并使用创建该备份时的数据保护密钥。</li><li>先用“测试连接”，成功后再执行备份；再检查页面显示的最近成功时间。</li></ul>`,
s8t:"8. 意见反馈",s8:`<p>如有任何疑问，可使用应用内“意见反馈”，或直接发送邮件至 <a href="mailto:userfeedback@zohomail.com">userfeedback@zohomail.com</a>。反馈时请附上手机系统版本、KeyScan 版本、问题发生步骤和错误提示；请勿附上真实密码、TOTP 密钥或数据保护密钥。</p>`,
s9t:"9. 导出数据与离线备份",s9:`<p><b>用途不同：</b>“数据保险 → 导出备份”用于保留可恢复的 KeyScan 加密备份；各模块的“导出”则用于在受控情况下导出选定内容。导出前先确认接收位置可信，避免把明文文件放到公共下载目录或即时通讯软件。</p><h3>数据保险的导出备份</h3><ol><li>进入首页 → 数据保险 → 导出备份。</li><li>选择需要纳入的内容，例如扫码记录、密码账本、TOTP；如页面提供保险箱选项，按实际需要勾选。</li><li>选择保存位置并完成导出。导出成功后，记录文件名、保存位置、创建日期和对应的数据保护密钥。</li><li>建议在换机、卸载、修改 PIN 或数据保护密钥之前，创建一份新的离线备份，并在另一台设备或可信位置保存副本。</li></ol><h3>模块级导出</h3><ul><li><b>密码账本：</b>可导出 Excel；如设置 Excel 打开密码，密码需要独立保存。Excel 一旦解密打开，内容不再受 KeyScan 保险库保护。</li><li><b>TOTP：</b>支持 URI 文本列表或加密 JSON；导出加密 JSON 时须设置专用导出密码，导入时也需要该密码。</li><li><b>安全保险箱：</b>可导出所选记录，且支持附件导出。确认导出完成前不要删除原附件。</li><li><b>通用数据导出：</b>仅导出用户选择的通用数据；不会导出应用数据库、Android Keystore、PIN、数据保护密钥等安全凭证。</li></ul><p class="note">导出文件不是自动同步：删除原数据、移动文件或换机后，都应单独确认备份文件仍能读取、密钥仍可取得。</p>`,
s10t:"10. 导入数据与恢复规则",s10:`<h3>导入与恢复的区别</h3><p>“导入数据”用于把外部文件或模块数据加入当前库；“从备份恢复”用于回到某个 KeyScan 备份版本。执行前都应先创建一次当前离线备份，避免误操作后无处回退。</p><h3>导入前检查</h3><ol><li>确认文件来源可信、未被篡改，且格式与目标模块匹配。</li><li>确认你知道导出时设置的加密密码或数据保护密钥。</li><li>先阅读预览、条数和冲突提示；不要在不了解来源的情况下直接导入含密码或 TOTP 密钥的文件。</li></ol><h3>通用导入与合并</h3><p>进入导入数据，选择文件并查看预览。相同数据会合并；当同一记录存在差异时，较新的记录可能覆盖旧记录。导入完成后检查成功、跳过和失败数量，并抽查关键记录、分组、附件与 TOTP 是否齐全。</p><h3>TOTP 导入</h3><p>可批量导入支持的令牌文件；加密 JSON 需输入其导出密码。导入后应对照原设备逐项核对动态码，不要立即清除旧设备上的令牌。</p><h3>换机恢复</h3><ol><li>在新设备先完成必要的安全设置。</li><li>使用本地备份文件或配置同一 WebDAV，选择正确时间点的备份。</li><li>输入创建该备份时的数据保护密钥；若凭证不匹配，按页面提示使用已保存的 16 位恢复密钥重置。</li><li>恢复后核对数据总览、密码账本、TOTP、保险箱附件和最近备份时间，再决定是否擦除旧设备。</li></ol><p class="note">若数据保护密钥和恢复密钥都丢失，加密备份无法被绕过或解密。</p>`,
s11t:"11. 回收站、验证与安全备份习惯",s11:`<h3>回收站</h3><p>删除的内容会先进入回收站，恢复后回到原来的功能模块。可在回收站内恢复单项/多项，或永久删除。永久删除、清空回收站后无法恢复。</p><ul><li>自动清理可设为 7 天、30 天（默认）、90 天或永久保留；保留越久越方便找回，设备中保留的敏感数据也越多。</li><li>恢复前先查看条目详情，确认没有与当前记录重复或冲突。</li><li>要转让设备或移除敏感内容时，完成备份确认后再执行永久删除，而不只是普通删除。</li></ul><h3>完整性验证</h3><p>在数据保险中运行“验证完整性”。它用于发现明显异常或不完整记录，不等于验证 WebDAV 服务、恢复密钥或所有附件都一定可用。若提示异常：先停止批量修改，导出当前加密备份，记录提示内容，再检查对应模块并重新备份。</p><h3>推荐的安全备份节奏</h3><ol><li>初次完成安全设置后：导出一份本地加密备份并配置 WebDAV。</li><li>新增重要密码、TOTP、保险箱附件后：立即同步；必要时再创建离线副本。</li><li>修改 PIN 或数据保护密钥后：立即创建新备份，旧备份可能无法用于当前保险库。</li><li>换机、卸载、刷机或送修前：测试最近备份、确认数据保护密钥和恢复密钥已独立保存。</li><li>定期：查看最近成功时间并运行完整性验证；不要只依赖“已经开了自动备份”。</li></ol>`,
s12t:"12. 悬浮窗全部功能说明",s12:`<p>悬浮按钮展开后共有 12 个快捷入口；它们是完整功能导航，不会绕过解锁、身份验证或数据保护步骤。</p><h3>1. 智能扫描</h3><p>打开相机扫描二维码、条形码；也可从相册识别。结果可以复制、打开、保存到历史记录或按内容转存。</p><h3>2. 分享中心</h3><p>将文本、网址等内容生成二维码，可调整颜色、圆点、圆角和 Logo，并保存到相册或历史记录。生成前确认文字、链接和接收对象。</p><h3>3. 随机密码</h3><p>按长度和字符集生成强随机密码，支持生成记录和备注。生成后可复制或用于创建密码账本记录；不要把生成历史当成唯一保存位置。</p><h3>4. 安全保险箱</h3><p>保存证件、银行卡、许可证、密钥、重要文档等敏感资料，并可添加附件。查看、复制、导出敏感字段时应在可信环境中操作。</p><h3>5. 密码账本</h3><p>创建和管理网站、账号、密码、分组与备注；可搜索、编辑、导出及使用强密码。自定义文件夹名称由用户管理，默认折叠显示。</p><h3>6. TOTP 认证器</h3><p>通过扫码或手动密钥添加动态验证码；验证码按服务商时间周期刷新，可一键复制。迁移前先导出或确认原服务商恢复方案。</p><h3>7. 设置</h3><p>管理界面、语言、WebDAV 与同步的具体选项。修改同步、网络或安全选项后应测试连接，并确认最近成功备份时间。</p><h3>8. 安全中心</h3><p>统一处理 PIN、生物识别、数据保护密钥、恢复密钥、安全状态与敏感操作验证。这里的密钥不是 WebDAV 登录密码，须独立保管。</p><h3>9. 备份与恢复</h3><p>进入三张功能卡：WebDAV 同步配置、在线备份与恢复、本地备份与恢复。用于加密保存和恢复 KeyScan 数据；恢复前先确认备份版本与数据保护密钥。</p><h3>10. 导出数据</h3><p>导出选定的密码账本、TOTP 或保险箱文字资料等通用数据。它不包含应用数据库、PIN、数据保护密钥和 Android Keystore；导出的明文或兼容文件必须另行保护。</p><h3>11. 回收站</h3><p>查看已删除内容，选择恢复或永久删除。恢复后项目回到原功能模块；永久删除和清空回收站不可撤销。</p><h3>12. 历史记录</h3><p>查看扫码和分享中心历史，支持搜索、编辑、删除、复制或转存到密码账本。历史中可能含敏感链接或文字，分享设备前应检查并清理。</p>`
};
const EN={...ZH,title:"KeyScan Help Manual",subtitle:"Offline help · arranged by workflow",quick:"Quick guide",full:"Full manual",toc:"Contents",
s1t:"1. Quick start",s1:`<ol><li>Set the Password Ledger unlock password and security question.</li><li>Optionally enable biometrics in Security Center.</li><li>Open Scan, Password Ledger, TOTP, Secure Vault, or Share Center from Home.</li><li>Create an encrypted backup after entering important data.</li></ol>`,
s2t:"2. Features",s2:`<h3>Scan</h3><p>Scan QR/barcodes with the camera or import an image. Verify results before opening links.</p><h3>Password Ledger</h3><p>Store sites, accounts, passwords and notes. Default and user-created folders are collapsed initially; tap a folder to expand it. Names such as “Test” are examples of user-defined names.</p><h3>TOTP</h3><p>Add tokens by QR scan or manual secret.</p><h3>Secure Vault</h3><p>Stores sensitive records and attachments; exports can include attachments.</p><h3>Secure Share</h3><p>Long-press an item to share it. There is no separate top-right share button.</p>`,
s3t:"3. Security Center",s3:`<p>Manage app unlock, biometrics, the data-protection key, backup/restore and security status here. Keep the master password and protection key safe. Never send passwords, TOTP secrets, recovery keys, or WebDAV app passwords through public chat.</p>`,
s4t:"4. Backup and restore",s4:`<p>This protects continuity after a new phone, reinstall, or device failure. Data is encrypted before upload.</p><ol><li>Open Security Center → Backup & Restore.</li><li>Set and securely retain the data-protection key.</li><li>Enter the WebDAV URL, account and app password; test the connection.</li><li>Back up and verify the latest-success time.</li><li>To restore, choose the correct backup and its original key, then verify record and attachment counts.</li></ol><p class="note">Sync is not a substitute for an offline encrypted copy before major changes.</p>`,
s5t:"5. Public WebDAV",s5:`<p>Availability and free policies may change; check each provider.</p><h3>InfiniCLOUD — Japan/Asia</h3><p>Free accounts currently support WebDAV. In My Page enable Apps Connection and copy your unique Connection URL, User ID and Apps Password.</p><h3>Koofr — most global regions</h3><p>Free registration is available. Account Settings → Preferences → Password: generate an app password. URL: <code>https://app.koofr.net/dav/Koofr</code>, port 443, user: registration email. Path case matters.</p><h3>Nutstore — mainland China</h3><p>Free registration is available. Account Info → Security Options → Third-party App Management: create a KeyScan app password. Create a keyscan folder and use <code>https://dav.jianguoyun.com/dav/keyscan</code>.</p><h3>Yandex Disk — regions where Yandex registration is available</h3><p>URL: <code>https://webdav.yandex.ru</code>, port 443, with a WebDAV app password. Since June 22, 2026, official policy requires a paid Yandex 360 plan for WebDAV, so it is no longer a free WebDAV option.</p>`,
s6t:"6. Home NAS WebDAV",s6:`<p>Keep phone and NAS on the same home router/Wi‑Fi. Create a dedicated KeyScan user and folder with only required read/write access.</p><h3>Synology</h3><p>Install WebDAV Server, enable HTTPS (usually 5006), grant application and folder permissions, then use <code>https://LAN-IP:5006/folder</code>. QuickConnect does not support WebDAV.</p><h3>QNAP</h3><p>Control Panel → Applications → Web Server → WebDAV; enable it, set shared-folder permissions and use <code>http(s)://LAN-IP:port/share</code>.</p><h3>TerraMaster</h3><p>Enable WebDAV under TOS file services, set a port and folder permissions, then connect with the NAS LAN IP.</p><p class="note">Reserve the NAS address in the router. Do not expose WebDAV to the internet unless you understand TLS, certificates, firewalling and access control.</p>`,
s7t:"7. Troubleshooting",s7:`<ul><li>401/403: check account, app password and permissions.</li><li>404: check URL, folder and case.</li><li>Timeout: check network; for NAS, use the same home LAN.</li><li>Certificate error: use a valid HTTPS certificate.</li><li>Restore failure: use the protection key that created that backup.</li><li>Test first, then back up and verify the latest-success time.</li></ul>`,
s8t:"8. Feedback",s8:`<p>Use in-app Feedback or email <a href="mailto:userfeedback@zohomail.com">userfeedback@zohomail.com</a>. Include OS version, KeyScan version, steps and error text. Never include real passwords, TOTP secrets or protection keys.</p>`,
s9t:"9. Export data and offline copies",s9:`<p><b>Different purposes:</b> Data Insurance → Export Backup creates a recoverable encrypted KeyScan backup. Module export releases selected content for controlled use. Always choose a trusted destination.</p><h3>Data Insurance export</h3><ol><li>Open Home → Data Insurance → Export Backup.</li><li>Select the content to include.</li><li>Choose a location; record the file name, location, date and protection key.</li><li>Create a new offline copy before changing PIN/protection-key, uninstalling or moving phones.</li></ol><h3>Module export</h3><ul><li><b>Password Ledger:</b> can export Excel. An Excel opening password is separate; once opened, it is no longer protected by KeyScan.</li><li><b>TOTP:</b> supports a URI text list or encrypted JSON. Encrypted JSON needs its dedicated export password to import.</li><li><b>Secure Vault:</b> selected records can be exported with attachments. Do not delete originals until the result is checked.</li><li><b>Generic export:</b> does not include the app database, Android Keystore, PIN or data-protection key.</li></ul>`,
s10t:"10. Import and restore rules",s10:`<p>Import adds compatible external/module data to the current store. Restore returns to a KeyScan backup version. Create a current offline backup first.</p><h3>Before import</h3><ol><li>Use only trusted files in the matching format.</li><li>Keep the export password or protection key ready.</li><li>Read the preview, count and conflict prompts before confirming.</li></ol><h3>Merge behavior</h3><p>Matching data is merged. When the same record differs, a newer record can replace an older one. Check successful, skipped and failed counts, then verify key records, folders, attachments and TOTP tokens.</p><h3>New-phone recovery</h3><ol><li>Set up required security on the new phone.</li><li>Select the correct local or WebDAV backup.</li><li>Enter the protection key used when it was created; if credentials do not match, use the saved 16-character recovery key.</li><li>Verify the overview, ledger, TOTP, vault attachments and latest backup before erasing the old phone.</li></ol><p class="note">A lost protection key and recovery key cannot be bypassed.</p>`,
s11t:"11. Trash, validation and backup habits",s11:`<h3>Trash</h3><p>Deleted items first go to Trash and can be restored to their original module. Permanent deletion and emptying Trash cannot be undone.</p><ul><li>Automatic cleanup can be 7, 30 (default), or 90 days, or retain forever.</li><li>Review details before restoring to avoid duplicates.</li><li>Before giving away a device, verify backups then permanently delete sensitive items.</li></ul><h3>Integrity validation</h3><p>Run Data Insurance → Validate Integrity to find obvious abnormal/incomplete records. It does not guarantee every remote backup or attachment is usable. If an issue is reported, create an encrypted backup before changing data.</p><h3>Recommended schedule</h3><ol><li>After initial setup: make an offline encrypted copy and configure WebDAV.</li><li>After important password, TOTP or attachment changes: sync immediately.</li><li>After changing PIN/protection key: create a new backup.</li><li>Before device migration, uninstall, reset or repair: test the latest backup and verify keys are stored separately.</li><li>Regularly: check the latest-success time and run integrity validation.</li></ol>`,
s12t:"12. All floating-menu shortcuts",s12:`<p>The floating button opens 12 shortcuts. They are navigation shortcuts and do not bypass unlock, authentication, or data-protection requirements.</p><h3>1. Smart Scan</h3><p>Scan QR codes/barcodes with camera or album; copy, open, save or transfer verified results.</p><h3>2. Share Center</h3><p>Create a QR code from text or a link; customize its appearance and save it to album/history.</p><h3>3. Random Password</h3><p>Generate strong passwords with chosen length and character sets; copy or use them in a ledger record.</p><h3>4. Secure Vault</h3><p>Store sensitive records and attachments such as IDs, cards, licences and keys.</p><h3>5. Password Ledger</h3><p>Manage sites, accounts, passwords, folders and notes; search, edit, export and generate strong passwords.</p><h3>6. TOTP Authenticator</h3><p>Add time-based codes by scan or manual secret, then copy refreshed codes.</p><h3>7. Settings</h3><p>Manage appearance, language, WebDAV and sync options. Test changed connections.</p><h3>8. Security Center</h3><p>Manage PIN, biometrics, data-protection/recovery keys and sensitive-action verification.</p><h3>9. Backup & Restore</h3><p>Open WebDAV configuration, online backup/restore and local backup/restore cards.</p><h3>10. Export Data</h3><p>Export selected compatible data. It never includes the app database, PIN, protection key or Android Keystore.</p><h3>11. Trash</h3><p>Restore deleted items or permanently delete them; irreversible actions cannot be undone.</p><h3>12. History</h3><p>Search, edit, delete, copy or transfer scan and Share Center history.</p>`};
