plugins {
    id 'com.android.application'
}

// Keep release packaging independent from stale/locked APKs in the legacy output directory.
layout.buildDirectory = file("$rootDir/build-release-output/app")

def keystorePropertiesFile = rootProject.file('release/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

android {
    namespace 'com.secureqr.scanner'
    compileSdk 36

    defaultConfig {
        applicationId 'com.secureqr.scanner'
        minSdk 26
        targetSdk 33
        versionCode 30
        versionName '1.0.0'
    }

    flavorDimensions 'distribution'
    productFlavors {
        keyscan {
            dimension 'distribution'
            applicationId 'com.secureqr.scanner'
        }
        migrationtest {
            dimension 'distribution'
            applicationId 'com.secureqr.scanner.migrationtest'
            versionNameSuffix '-migrationtest'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
	    debug {
			signingConfig signingConfigs.release
			debuggable true
			minifyEnabled false
		}
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "KeyScan-v${variant.versionName}-${variant.name}-latest.apk"
        }
    }
}

dependencies {
    implementation 'androidx.autofill:autofill:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.camera:camera-core:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.poi:poi-ooxml:4.1.2'
    implementation 'net.zetetic:sqlcipher-android:4.17.0'
    implementation 'androidx.sqlite:sqlite:2.6.2'
}
